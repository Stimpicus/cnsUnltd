# Drop-in jobs for pandora/.github/workflows/ci.yml AND elpis-os/.github/workflows/ci.yml.
# Paste these jobs under the existing `jobs:` map. License-free (gitleaks BINARY, not the
# action) so it works on the private product repos. Pairs with `.gitleaks.toml` at repo root.

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — catch a secret in any past commit
      - name: install gitleaks (binary; no action license needed for private repos)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: scan (fail the job on any finding)
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner --exit-code 1

